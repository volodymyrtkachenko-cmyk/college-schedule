[pytest]
pythonpath = .
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.*
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette.*
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.*
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:anyio.*

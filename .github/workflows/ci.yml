name: CI Verification
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
concurrency:
  group: ci-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Backend, PostgreSQL migration and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: college_schedule
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: college_schedule_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U college_schedule -d college_schedule_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      RUN_MIGRATIONS: 'false'
      RUN_CRON: 'false'
      ENVIRONMENT: development
      TEST_POSTGRES_URL: postgresql+psycopg://college_schedule:isolated-ci-only@localhost:5432/college_schedule_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit && node --test tests/*.cjs
        working-directory: frontend

  deploy-heroku:
    name: Deploy to Heroku
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          set -eu
          if [ -n "${HEROKU_API_KEY:-}" ] && [ -n "${HEROKU_APP_NAME:-}" ]; then
            git push --force \
              "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" \
              "HEAD:main"
          else
            echo "Heroku credentials not configured; skipping deployment."
          fi

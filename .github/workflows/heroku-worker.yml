name: Scale Heroku worker

on:
  workflow_dispatch:
    inputs:
      quantity:
        description: "Number of Heroku worker dynos"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  scale-worker:
    name: Scale Classroom worker
    runs-on: ubuntu-latest
    steps:
      - name: Scale worker dyno
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          WORKER_QUANTITY: ${{ inputs.quantity }}
        run: |
          set -eu
          test -n "$HEROKU_API_KEY"
          test -n "$HEROKU_APP_NAME"
          case "$WORKER_QUANTITY" in
            ''|*[!0-9]*) echo "quantity must be a non-negative integer" >&2; exit 1 ;;
          esac

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.heroku.com/apps/${HEROKU_APP_NAME}/formation" \
            --header "Accept: application/vnd.heroku+json; version=3" \
            --header "Authorization: Bearer ${HEROKU_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"updates\":[{\"type\":\"worker\",\"quantity\":${WORKER_QUANTITY}}]}"

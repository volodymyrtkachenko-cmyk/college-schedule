name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      worker_quantity:
        description: "Number of Heroku worker dynos"
        required: true
        default: "1"
        type: string
      operation:
        description: "Action to perform"
        required: true
        default: "scale"
        type: choice
        options:
          - scale
          - logs

jobs:
  scale-heroku-worker:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'scale'
    name: Scale Heroku Classroom worker
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scale worker dyno
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        WORKER_QUANTITY: ${{ inputs.worker_quantity }}
      run: |
        set -eu
        test -n "$HEROKU_API_KEY"
        test -n "$HEROKU_APP_NAME"
        case "$WORKER_QUANTITY" in
          ''|*[!0-9]*) echo "worker_quantity must be a non-negative integer" >&2; exit 1 ;;
        esac

        git push --force \
          "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" \
          "HEAD:main"

        curl --fail-with-body --silent --show-error \
          --request PATCH \
          --url "https://api.heroku.com/apps/${HEROKU_APP_NAME}/formation" \
          --header "Accept: application/vnd.heroku+json; version=3" \
          --header "Authorization: Bearer ${HEROKU_API_KEY}" \
          --header "Content-Type: application/json" \
          --data "{\"updates\":[{\"type\":\"worker\",\"quantity\":${WORKER_QUANTITY}}]}"

  heroku-logs:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'logs'
    name: Read Heroku worker logs
    runs-on: ubuntu-latest
    steps:
    - name: Fetch recent logs
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        set -eu
        test -n "$HEROKU_API_KEY"
        test -n "$HEROKU_APP_NAME"
        session="$(
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.heroku.com/apps/${HEROKU_APP_NAME}/log-sessions" \
            --header "Accept: application/vnd.heroku+json; version=3" \
            --header "Authorization: Bearer ${HEROKU_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"source":"app","dyno":"worker","lines":200,"tail":false}' |
          python -c 'import json, sys; print(json.load(sys.stdin)["logplex_url"])'
        )"
        curl --fail-with-body --silent --show-error "$session"
          --header "Accept: application/vnd.heroku+json; version=3" \
          --header "Authorization: Bearer ${HEROKU_API_KEY}"

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Test with pytest
      run: |
        cd backend
        pytest
